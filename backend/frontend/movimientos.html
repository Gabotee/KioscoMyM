<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/uploads/Logo_Kiosco_MyM.jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Movimientos — Kiosco MyM</title>
  <meta name="description" content="Historial de movimientos de stock — Kiosco MyM." />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .history-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .history-filters .form-control {
      flex: 1;
      min-width: 130px;
    }

    @media (max-width: 768px) {
      .history-filters {
        flex-direction: column;
        gap: 8px;
      }

      .history-filters .form-control,
      .history-filters .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">
          <img src="/uploads/Logo_Kiosco_MyM.jpeg" alt="Logo Kiosco MyM" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
        </div>
        <div>
          <div class="sidebar-title">Kiosco MyM</div>
          <div class="sidebar-subtitle">Stock Manager</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>
        <a href="/dashboard" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span> Dashboard</a>
        <a href="/stock" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span> Stock</a>
        <a href="/ventas" class="nav-link"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span> Ventas</a>
        <a href="/movimientos" class="nav-link active"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span> Movimientos</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="sidebar-username">Admin</div>
            <div class="user-role">Administrador</div>
          </div>
        </div>
        <button data-action="logout" class="btn btn-secondary w-full mt-2 btn-icon-svg" style="font-size:13px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="page-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menú">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="page-title">Movimientos</h1>
            <p class="page-subtitle">Historial completo de ingresos y egresos de stock</p>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle-btn" title="Cambiar tema" aria-label="Cambiar tema">☀️</button>
      </div>

      <div class="page-content">
        <div class="card">
          <div class="card-header">
            <h3 style="font-size:15px; font-weight:600;">Historial de movimientos</h3>
            <span id="history-count" style="font-size:12px; color:var(--text-muted);"></span>
          </div>
          <div class="card-body" style="padding-bottom:8px;">
            <!-- Filtros -->
            <div class="history-filters">
              <select id="filter-type" class="form-control" style="width:auto;">
                <option value="">Todos los tipos</option>
                <option value="ingreso">📥 Ingresos</option>
                <option value="egreso">📤 Egresos</option>
              </select>
              <input type="date" id="filter-date-from" class="form-control" style="width:auto;" />
              <input type="date" id="filter-date-to" class="form-control" style="width:auto;" />
              <button class="btn btn-secondary btn-sm" id="btn-filtrar">Filtrar</button>
            </div>
          </div>
          <div id="history-body">
            <div class="loading-state">
              <div class="spinner"></div>
              <span>Cargando historial...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/movimientos.js"></script>
  <script src="/js/sidebar.js"></script>
</body>

</html>
